<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>TV013 — Player</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #stage{position:absolute;inset:0 0 44px;display:grid;place-items:center;background:#000}#stage video,#stage img,#stage iframe{width:100%;height:100%;object-fit:contain;border:0}
    #news{position:absolute;bottom:0;left:0;right:0;height:44px;background:#b91c1c;display:flex;align-items:center;overflow:hidden;font-weight:bold}
    #newsLabel{height:100%;padding:0 18px;display:grid;place-items:center;background:#7f1d1d;white-space:nowrap;z-index:1}
    #headlines{white-space:nowrap;padding-left:100%;animation:scroll 42s linear infinite}
    @keyframes scroll{to{transform:translateX(-100%)}}
    #message{color:#cbd5e1;text-align:center;padding:20px;font-size:1.3rem}
    #audioButton{position:fixed;right:12px;top:12px;z-index:5;border:0;border-radius:6px;padding:10px;background:#ffffffd9;color:#111;cursor:pointer}
  </style>
</head>
<body>
  <main id="stage"><div id="message">Conectando à programação...</div></main>
  <button id="audioButton" type="button">Ativar áudio</button>
  <footer id="news"><span id="newsLabel">NOTÍCIAS</span><div id="headlines"></div></footer>
  <script src="/js/cloudflare-player.js"></script>
</body>
</html>
